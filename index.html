  <meta property="og:locale" content="ar_AR" />
  <meta property="og:title" content="المنصة | Elmanssa - منصة تعليمية عربية متكاملة" />

    content="منصة تعليمية عربية رائدة توفر دورات احترافية، بث مباشر تفاعلي، واختبارات متقدمة." />

  <!-- Twitter Card -->
  <meta name="twitter:card" content="summary_large_image" />
  <meta name="twitter:title" content="المنصة | Elmanssa" />

    content="منصة تعليمية عربية رائدة توفر دورات احترافية، بث مباشر تفاعلي، واختبارات متقدمة." />

  <!-- Theme Color -->
  <meta name="theme-color" content="#034289" />

  <!-- Preconnect to API so the first request has no DNS/TCP overhead -->
  <link rel="preconnect" href="https://api.elmanssa.com" crossorigin />
  <link rel="dns-prefetch" href="https://api.elmanssa.com" />

  <!-- Google Fonts — preconnect first, then load async to avoid render-blocking -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <!-- Load font non-blocking: media="print" trick swaps to "all" once loaded -->
  <link
    href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;500;600;700;800;900&display=swap"
    rel="stylesheet"
    media="print"
    onload="this.media='all'"
  />
  <!-- Fallback for no-JS -->
  <noscript>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;500;600;700;800;900&display=swap" rel="stylesheet" />
  </noscript>

  <style>
    /* Show Cairo immediately once it loads; fall back to system Arabic font */
    body {
      font-family: 'Cairo', 'Segoe UI', Tahoma, Arial, sans-serif;
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
      text-rendering: optimizeLegibility;

    html {
      scroll-behavior: smooth;
    }
  </style>
